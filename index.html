<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>SkyLine Flight Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=B612+Mono:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="world"></div>
  <div id="fx"><div id="cloudfx"></div><div id="rainfx"></div><div id="blackout"></div></div>
  <div id="hudLayer"></div>

  <header id="topbar" class="hidden">
    <div class="tb-left"><span id="tbAircraft"></span><span id="tbPos" class="dim"></span></div>
    <div class="tb-mid">
      <span id="tbUtc"></span><span id="tbRate"></span><span id="tbPause" class="warn hidden">PAUSED</span>
    </div>
    <div class="tb-right">
      <div class="seg" id="viewSeg">
        <button data-view="cockpit" title="1">조종석</button><button data-view="cockpit-hud" title="2">HUD</button>
        <button data-view="chase" title="3">외부</button><button data-view="tower" title="4">관제탑</button>
        <button data-view="flyby" title="5">플라이바이</button><button data-view="free" title="6">자유</button>
      </div>
      <button id="btnOverhead" title="O">시스템</button>
      <button id="btnChecklist" title="C">체크리스트</button>
      <button id="btnMap" title="M">지도</button>
      <button id="btnFms">FMS</button>
      <button id="btnTouch" title="화면 터치 조종">터치</button>
      <button id="btnDiag" title="렌더링 진단 정보">진단</button>
      <button id="btnMenu" title="Esc">메뉴</button>
    </div>
  </header>

  <section id="panel" class="hidden">
    <div id="mcp"></div>
    <div id="dus"></div>
    <div id="pedestal"></div>
  </section>

  <div id="overhead" class="window hidden"><div class="win-head">OVERHEAD / SYSTEMS<button class="close">×</button></div><div class="win-body"></div></div>
  <div id="checklist" class="window hidden"><div class="win-head">CHECKLIST<button class="close">×</button></div><div class="win-body"></div></div>
  <div id="mapwin" class="window hidden"><div class="win-head">NAV MAP<button class="close">×</button></div><div class="win-body"></div></div>
  <div id="fmswin" class="window hidden"><div class="win-head">FMS / RADIO<button class="close">×</button></div><div class="win-body"></div></div>

  <div id="diagwin" class="window hidden"><div class="win-head">DIAGNOSTICS / 진단<button class="close">×</button></div><div class="win-body"></div></div>
  <div id="errBanner" class="hidden"><span id="errBannerText"></span><button id="errBannerOpen">진단 보기</button></div>
  <div id="toast"></div>
  <div id="crash" class="overlay hidden"><div class="card"><h2>SIMULATION STOPPED</h2><p id="crashReason"></p><div class="row"><button id="crashRetry" class="primary">같은 조건으로 재시작</button><button id="crashMenu">메뉴로</button></div></div></div>
  <div id="loading" class="overlay"><div class="card"><div class="spinner"></div><p id="loadingText">데이터베이스 로딩 중…</p></div></div>

  <main id="menu" class="hidden"></main>
  <script>
    // Boot watchdog (classic script: runs even when module scripts are blocked).
    (function () {
      var help = '<div style="text-align:left;line-height:1.7;font-size:13px;margin-top:10px">' +
        '<b>이 게임은 웹 서버로 실행해야 합니다.</b><br>' +
        'index.html 파일을 직접 열면(더블클릭, 파일 미리보기) 브라우저 보안 정책 때문에 실행되지 않습니다.<br><br>' +
        '▶ <b>Windows</b>: 폴더의 <code>start.bat</code> 더블클릭<br>' +
        '▶ <b>macOS</b>: <code>start.command</code> 더블클릭<br>' +
        '▶ <b>터미널</b>: <code>npm install</code> → <code>npm start</code><br>' +
        '<span style="color:#8593a3">(Node.js LTS 필요: https://nodejs.org)</span></div>';
      function show(html) {
        var t = document.getElementById('loadingText'); if (t) t.innerHTML = html;
        var sp = document.querySelector('#loading .spinner'); if (sp) sp.style.display = 'none';
      }
      if (location.protocol === 'file:') {
        // stylesheets are blocked on file:// too — replace the whole page with a self-styled notice
        document.addEventListener('DOMContentLoaded', function () {
          document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0e12;color:#dfe6ee;font-family:system-ui,sans-serif">' +
            '<div style="max-width:520px;padding:28px 34px;background:#11161c;border:1px solid #263241;border-radius:8px">' +
            '<div style="font:600 18px monospace;letter-spacing:3px;margin-bottom:6px">SKY<span style="color:#3aa0ff">LINE</span></div>' +
            '<b style="color:#ffb020">파일로 직접 열었습니다</b>' + help + '</div></div>';
        });
        return;
      }
      if (/github\.io$/.test(location.hostname)) {
        // GitHub Pages serving the raw branch (unbuilt TypeScript) instead of the Actions build
        help = '<div style="text-align:left;line-height:1.7;font-size:13px;margin-top:10px">' +
          'GitHub Pages가 <b>빌드되지 않은 소스</b>를 서비스하고 있습니다.<br>' +
          '저장소 <b>Settings → Pages → Build and deployment → Source</b> 를<br><b>“GitHub Actions”</b> 로 바꾸면 자동으로 빌드·배포됩니다 (1~2분).</div>';
      }
      window.addEventListener('error', function (e) {
        if (window.__booted) return;
        var src = e.target && (e.target.src || e.target.href);
        show('<b style="color:#ff4d4d">로딩 실패</b><br>' + (e.message || ('불러오지 못함: ' + (src || '스크립트'))) + help);
      }, true);
      setTimeout(function () {
        if (!window.__booted) show('로딩이 오래 걸리고 있습니다… (첫 실행은 최대 30초)<br><span style="font-size:11px;color:#8593a3">계속 멈춰 있으면 F12 → Console 탭의 빨간 오류를 확인하세요.</span>' + help);
      }, 20000);
    })();
  </script>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
